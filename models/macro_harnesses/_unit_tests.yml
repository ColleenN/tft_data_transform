version: 2

unit_tests:
  - name: latest_raw_match_detail_live
    model: harness_latest_raw_match_detail
    overrides:
      vars: {harness_env: live}
    given: &matches
      - input: ref('unique_matches')
        rows:
          - {match_id: NA1_1, tft_set_number: 17}
          - {match_id: NA1_2, tft_set_number: 17}
          - {match_id: NA1_3, tft_set_number: 17}
          - {match_id: NA1_4, tft_set_number: 16}
          - {match_id: NA1_5, tft_set_number: 17}
          - {match_id: PBE1_1, tft_set_number: 17}
          - {match_id: PBE1_2, tft_set_number: 17}
      - input: ref('match_reference_snapshots')
        rows:
          - {match_id: NA1_1, channel: live, patch: "16.21"}
          # another build of the same patch
          - {match_id: NA1_2, channel: live, patch: "16.21"}
          # sorts after 16.21 as a string, before it as a number
          - {match_id: NA1_3, channel: live, patch: "16.9"}
          - {match_id: NA1_4, channel: live, patch: "16.22"}
          - {match_id: NA1_5, channel: live, patch: null}
          - {match_id: PBE1_1, channel: pbe, patch: "16.22"}
          - {match_id: PBE1_2, channel: pbe, patch: "16.21"}
    expect:
      rows:
        - {match_id: NA1_1}
        - {match_id: NA1_2}

  - name: latest_raw_match_detail_pbe
    model: harness_latest_raw_match_detail
    overrides:
      vars: {harness_env: pbe}
    given: *matches
    expect:
      rows:
        - {match_id: PBE1_1}
