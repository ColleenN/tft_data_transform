  - name: comp_cores_standard_and_variants
    model: comp_cores
    given:
      - input: ref('seed_annotated_boards')
        rows:
          - {match_id: PBE1_1, puuid: a, tft_set_number: 19, placement: 1}
          - {match_id: PBE1_1, puuid: b, tft_set_number: 19, placement: 2}
          - {match_id: PBE1_1, puuid: c, tft_set_number: 19, placement: 3}
          - {match_id: PBE1_1, puuid: d, tft_set_number: 19, placement: 2}
          - {match_id: PBE1_1, puuid: e, tft_set_number: 19, placement: 5}
          - {match_id: PBE1_1, puuid: f, tft_set_number: 19, placement: 7}
          - {match_id: PBE1_1, puuid: g, tft_set_number: 19, placement: 8}
          - {match_id: PBE1_1, puuid: h, tft_set_number: 19, placement: 4}
          - {match_id: PBE1_2, puuid: i, tft_set_number: 19, placement: 8}
      - input: ref('board_cores')
        rows:
          - {match_id: PBE1_1, puuid: a, leveling_pattern: fast_8, main_carry_character_id: X, main_tank_character_id: T, core_set: T + X + Y, cap_character_id: Z}
          - {match_id: PBE1_1, puuid: b, leveling_pattern: fast_8, main_carry_character_id: X, main_tank_character_id: T, core_set: T + X + Y, cap_character_id: Z}
          - {match_id: PBE1_1, puuid: c, leveling_pattern: fast_8, main_carry_character_id: X, main_tank_character_id: T, core_set: T + X + Y, cap_character_id: null}
          - {match_id: PBE1_1, puuid: d, leveling_pattern: fast_8, main_carry_character_id: X, main_tank_character_id: T, core_set: T + X + Y, cap_character_id: null}
          # Y swapped for W
          - {match_id: PBE1_1, puuid: e, leveling_pattern: fast_8, main_carry_character_id: X, main_tank_character_id: T, core_set: T + W + X, cap_character_id: null}
          - {match_id: PBE1_1, puuid: f, leveling_pattern: fast_8, main_carry_character_id: X, main_tank_character_id: T, core_set: T + W + X, cap_character_id: null}
          # Y missing
          - {match_id: PBE1_1, puuid: g, leveling_pattern: fast_8, main_carry_character_id: X, main_tank_character_id: T, core_set: T + X, cap_character_id: null}
          # W added
          - {match_id: PBE1_1, puuid: h, leveling_pattern: fast_8, main_carry_character_id: X, main_tank_character_id: T, core_set: T + W + X + Y, cap_character_id: null}
          # too early to count
          - {match_id: PBE1_2, puuid: i, leveling_pattern: undetermined, main_carry_character_id: X, main_tank_character_id: T, core_set: T + X, cap_character_id: null}
      - input: ref('match_reference_snapshots')
        rows:
          - {match_id: PBE1_1, channel: pbe, patch: "19.1"}
          - {match_id: PBE1_2, channel: pbe, patch: "19.1"}
    expect:
      rows:
        - {family: X + T, core_set: T + X + Y, core_set_rank: 1, variant_type: standard, units_added: "", units_dropped: "", num_boards: 4, family_share: 0.5, avg_placement: 2.0, cap_rate: 0.5}
        - {family: X + T, core_set: T + W + X, core_set_rank: 2, variant_type: swap, units_added: W, units_dropped: Y, num_boards: 2, family_share: 0.25, avg_placement: 6.0, cap_rate: 0.0}
        - {family: X + T, core_set: T + W + X + Y, core_set_rank: 3, variant_type: extra, units_added: W, units_dropped: "", num_boards: 1, family_share: 0.125, avg_placement: 4.0, cap_rate: 0.0}
        - {family: X + T, core_set: T + X, core_set_rank: 4, variant_type: missing, units_added: "", units_dropped: Y, num_boards: 1, family_share: 0.125, avg_placement: 8.0, cap_rate: 0.0}

