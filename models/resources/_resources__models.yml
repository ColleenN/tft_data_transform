          - {match_id: PBE1_1, puuid: b, character_id: C, shop_unit: true}
          - {match_id: PBE1_1, puuid: b, character_id: S, shop_unit: true}
          - {match_id: PBE1_1, puuid: c, character_id: X, shop_unit: true}
          - {match_id: PBE1_1, puuid: c, character_id: S, shop_unit: true}
          - {match_id: PBE1_1, puuid: d, character_id: X, shop_unit: true}
          - {match_id: PBE1_1, puuid: d, character_id: T, shop_unit: true}
      - input: ref('set_unit_traits')
        rows:
          - {source_object: a.gz, set_num: 19, api_name: C, trait_api_name: TR, num_trait_units: 2}
          - {source_object: a.gz, set_num: 19, api_name: S, trait_api_name: TR, num_trait_units: 2}
          - {source_object: a.gz, set_num: 19, api_name: F, trait_api_name: FU, num_trait_units: 1}
    expect:
      rows:
        - {family: X + T, cap_character_id: C, character_id: S, num_capped_boards: 2, rate_with_cap: 1.0, expected_rate: 0.0, shares_trait: true, is_support: true}
