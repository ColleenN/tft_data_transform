version: 2

models:
  - name: board_resources
    description: >
      One row per board and resource (level, gold left, unit slots and value,
      item categories, components), from the current patch's aggregated
      boards. afk_suspected marks boards with no items or components at all,
      which players still in the game almost never have.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, puuid, resource]

  - name: baseline_rounds
    description: >
      Which baseline round each elimination round is compared with, per set,
      channel and patch. PvE rounds are compared with the round before them.
      Rounds with fewer
      boards than var('baseline_min_boards') sets for their channel (200 on
      PBE, 500 on live by default) use the next round that has enough, or the
      last one before them when none follows. AFK-suspected boards don't
      count.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tft_set_number, channel, patch, last_round]

  - name: resource_baselines
    description: >
      Mean, sample standard deviation and board count of each resource per
      set, channel, patch and baseline round, leaving out AFK-suspected
      boards.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tft_set_number, channel, patch, baseline_round, resource]

  - name: board_resource_z_scores
    description: >
      Each board's resources as z-scores against its baseline round on the
      same set, channel and patch. AFK-suspected boards keep their z-scores
      but aren't part of any baseline. z_score is NULL when the baseline has
      no spread or no boards.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, puuid, resource]

  - name: board_cores
    description: >
      Each board's core and cap, counting full items only (everything but
      loose components; emblems count). Tanks are units with a tank role;
      every other unit, fighters included, is a carry. The cheapest carry
      with var('core_min_full_items') (2) or more full items sets the core's
      cost; a carry with that many items that costs more, and at least
      var('cap_min_cost') (4), is a cap, and the cap with the most items is
      cap_character_id. In the core, the main unit on each side holds the
      most full items (ties go to star level, then cost) and a second unit
      with var('core_min_full_items') or more is the secondary.
      core_character_ids lists every core unit with that many items, and
      core_set joins them into one key.
      leveling_pattern comes from the main core carry's cost, or from a
      cheaper core carry at 3 stars costing up to var('reroll_max_cost') (3),
      since a reroll's items go to whichever carry reached 3 stars first: undetermined
      before var('leveling_pattern_from_stage') (4 by default), no_carry when
      no carry holds a full item, and unclassified when
      seed_leveling_patterns has no row for the cost.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, puuid]

  - name: comp_cores
    description: >
      The core sets each family (main core carry plus main tank) plays, per
      set, channel, patch and leveling pattern, from boards past
      var('leveling_pattern_from_stage'). The family's most common set is its
      standard core (variant_type = standard); other sets list the units
      they add and drop against it and are a swap (one in, one out), extra
      (one added), missing (one dropped) or other. cap_rate is the share of
      the set's boards that also had a cap.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tft_set_number, channel, patch, leveling_pattern, family, core_set]

  - name: comp_cap_supports
    description: >
      For each family, cap and unit outside the core, per set, channel, patch
      and leveling pattern: how often the unit is on boards with that cap
      (rate_with_cap) against how often it's on the family's other boards at
      the same level (expected_rate), and whether it shares a trait with the
      cap (unique traits don't count). A support shares a trait, has a
      rate_with_cap of var('cap_support_min_rate') (0.5) or more, and a lift
      of var('cap_support_min_lift') (0.25) or more.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tft_set_number, channel, patch, leveling_pattern, family, cap_character_id, character_id]

  - name: comp_resource_profiles
    description: >
      How much of each resource a comp typically holds compared with the
      field: the mean z-score per set, channel, patch, stage and resource, for
      each leveling pattern (group_level = leveling_pattern), main carry
      (group_level = carry) and family, the main carry plus main tank
      (group_level = family, keyed "carry + tank"). AFK-suspected boards are left out. Use
      num_boards and standard_error to tell thin groups apart.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tft_set_number, channel, patch, group_level, group_key, leveling_pattern, stage, resource]

  - name: comp_placement_profiles
    description: >
      How each comp's games end: the share at each placement (placement 1 is
      the win rate), average, spread, top-4 rate and average elimination
      round, per set, channel, patch, and leveling pattern (group_level =
      leveling_pattern), main carry (group_level = carry) or family, the main
      carry plus main tank (group_level = family). The pattern comes from
      the final board, so a comp that dies before it comes together counts
      toward a cheaper pattern or undetermined.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tft_set_number, channel, patch, group_level, group_key, leveling_pattern]

  - name: comp_resource_sensitivity
    description: >
      How much a resource lead goes with finishing ahead of a lobbymate, per
      set, channel, patch, resource, and leveling pattern (group_level =
      leveling_pattern), main carry (group_level = carry) or family, the main
      carry plus main tank (group_level = family). Each board is paired
      with every non-AFK lobbymate from its own side. placed_better_rate is
      how often the group finishes ahead of a lobbymate at all, the
      comparison point for placed_better_rate_when_ahead (how often it did
      when its z-score was higher). placed_better_per_z_lead is the linear
      slope per 1 SD of lead, and r_squared how much of finishing ahead the
      lead explains. Boards are recorded when eliminated, so the two sides of
      a pair come from different points in the game.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tft_set_number, channel, patch, group_level, group_key, leveling_pattern, resource]

unit_tests:
  - name: baseline_rounds_fold_thin_and_pve_rounds
    model: baseline_rounds
    overrides:
      vars: {baseline_min_boards: {pbe: 2, live: 3}}
    given:
      - input: ref('board_resources')
        rows:
          - {match_id: PBE1_1, puuid: a, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 10, afk_suspected: false, resource: level}
          - {match_id: PBE1_1, puuid: b, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 11, afk_suspected: false, resource: level}
          - {match_id: PBE1_2, puuid: c, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 11, afk_suspected: false, resource: level}
          # one board, but two resources: still one board
          - {match_id: PBE1_1, puuid: d, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 12, afk_suspected: false, resource: level}
          - {match_id: PBE1_1, puuid: d, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 12, afk_suspected: false, resource: gold_left}
          # AFK boards don't count toward the round
          - {match_id: PBE1_2, puuid: x, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 12, afk_suspected: true, resource: level}
          - {match_id: PBE1_2, puuid: e, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 13, afk_suspected: false, resource: level}
          - {match_id: PBE1_3, puuid: f, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 13, afk_suspected: false, resource: level}
          # past the last round with enough boards
          - {match_id: PBE1_3, puuid: g, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 14, afk_suspected: false, resource: level}
          # another patch with no round that has enough
          - {match_id: PBE1_4, puuid: h, tft_set_number: 19, channel: pbe, patch: "19.2", last_round: 20, afk_suspected: false, resource: level}
          # a PvE round joins the round before it
          - {match_id: PBE1_5, puuid: i, tft_set_number: 19, channel: pbe, patch: "19.3", last_round: 24, afk_suspected: false, resource: level}
          - {match_id: PBE1_5, puuid: j, tft_set_number: 19, channel: pbe, patch: "19.3", last_round: 25, afk_suspected: false, resource: level}
          # live needs 3 boards: 2 at round 10 fold, 3 at round 11 don't
          - {match_id: NA1_1, puuid: a, tft_set_number: 19, channel: live, patch: "19.1", last_round: 10, afk_suspected: false, resource: level}
          - {match_id: NA1_1, puuid: b, tft_set_number: 19, channel: live, patch: "19.1", last_round: 10, afk_suspected: false, resource: level}
          - {match_id: NA1_1, puuid: c, tft_set_number: 19, channel: live, patch: "19.1", last_round: 11, afk_suspected: false, resource: level}
          - {match_id: NA1_2, puuid: d, tft_set_number: 19, channel: live, patch: "19.1", last_round: 11, afk_suspected: false, resource: level}
          - {match_id: NA1_2, puuid: e, tft_set_number: 19, channel: live, patch: "19.1", last_round: 11, afk_suspected: false, resource: level}
      - input: ref('seed_round_schedule')
        rows:
          - {set_num: 19, round_num: 10, stage: 2, round_type: pvp}
          - {set_num: 19, round_num: 11, stage: 2, round_type: pvp}
          - {set_num: 19, round_num: 24, stage: 4, round_type: pvp}
          - {set_num: 19, round_num: 25, stage: 4, round_type: pve}
    expect:
      rows:
        - {channel: pbe, patch: "19.1", last_round: 10, comparison_round: 10, num_boards: 1, baseline_round: 11}
        - {channel: pbe, patch: "19.1", last_round: 11, comparison_round: 11, num_boards: 2, baseline_round: 11}
        - {channel: pbe, patch: "19.1", last_round: 12, comparison_round: 12, num_boards: 1, baseline_round: 13}
        - {channel: pbe, patch: "19.1", last_round: 13, comparison_round: 13, num_boards: 2, baseline_round: 13}
        - {channel: pbe, patch: "19.1", last_round: 14, comparison_round: 14, num_boards: 1, baseline_round: 13}
        - {channel: pbe, patch: "19.2", last_round: 20, comparison_round: 20, num_boards: 1, baseline_round: 20}
        - {channel: pbe, patch: "19.3", last_round: 24, comparison_round: 24, num_boards: 2, baseline_round: 24}
        - {channel: pbe, patch: "19.3", last_round: 25, comparison_round: 24, num_boards: 2, baseline_round: 24}
        - {channel: live, patch: "19.1", last_round: 10, comparison_round: 10, num_boards: 2, baseline_round: 11}
        - {channel: live, patch: "19.1", last_round: 11, comparison_round: 11, num_boards: 3, baseline_round: 11}

  - name: resource_baselines_leave_out_afk_boards
    model: resource_baselines
    given:
      - input: ref('board_resources')
        rows:
          - {match_id: PBE1_1, puuid: a, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 18, afk_suspected: false, resource: gold_left, value: 2}
          - {match_id: PBE1_1, puuid: b, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 18, afk_suspected: false, resource: gold_left, value: 4}
          - {match_id: PBE1_1, puuid: c, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 18, afk_suspected: true, resource: gold_left, value: 120}
      - input: ref('baseline_rounds')
        rows:
          - {tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 18, baseline_round: 18}
      - input: ref('seed_round_schedule')
        rows:
          - {set_num: 19, round_num: 18, round_label: "3-7"}
    expect:
      rows:
        - {baseline_round: 18, baseline_round_label: "3-7", resource: gold_left, baseline_mean: 3, baseline_boards: 2}

  - name: board_resource_z_scores_against_baseline_round
    model: board_resource_z_scores
    given:
      - input: ref('board_resources')
        rows:
          - {match_id: PBE1_1, puuid: a, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 12, afk_suspected: false, resource: num_items, value: 5}
          - {match_id: PBE1_1, puuid: a, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 12, afk_suspected: false, resource: num_pans, value: 0}
          # a round whose baseline has no boards keeps its rows
          - {match_id: PBE1_2, puuid: b, tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 40, afk_suspected: true, resource: num_items, value: 0}
      - input: ref('baseline_rounds')
        rows:
          - {tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 12, baseline_round: 13}
          - {tft_set_number: 19, channel: pbe, patch: "19.1", last_round: 40, baseline_round: 40}
      - input: ref('resource_baselines')
        rows:
          - {tft_set_number: 19, channel: pbe, patch: "19.1", baseline_round: 13, baseline_round_label: "3-2", resource: num_items, baseline_mean: 4, baseline_stddev: 0.5, baseline_boards: 600}
          # no spread
          - {tft_set_number: 19, channel: pbe, patch: "19.1", baseline_round: 13, baseline_round_label: "3-2", resource: num_pans, baseline_mean: 0, baseline_stddev: 0, baseline_boards: 600}
    expect:
      rows:
        - {puuid: a, resource: num_items, afk_suspected: false, baseline_round: 13, baseline_round_label: "3-2", z_score: 2.0}
        - {puuid: a, resource: num_pans, afk_suspected: false, baseline_round: 13, baseline_round_label: "3-2", z_score: null}
        - {puuid: b, resource: num_items, afk_suspected: true, baseline_round: 40, baseline_round_label: null, z_score: null}

  - name: board_cores_split_core_and_cap
    model: board_cores
    given:
      - input: ref('seed_annotated_unit_items')
        rows:
          # a: carry X (cost 3) has 3 full items, so the core costs 3 and carry Y (cost 4)
          # is a cap; carry W has 1 plus a component; tank T 2; a summon with more is skipped
          - {match_id: PBE1_1, puuid: a, character_id: X, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: X, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: X, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: Y, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: Y, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: W, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: W, tier: 2, unit_instance_index: 1, num_components: 1}
          - {match_id: PBE1_1, puuid: a, character_id: T, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: T, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: S, tier: 1, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: S, tier: 1, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: S, tier: 1, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: a, character_id: S, tier: 1, unit_instance_index: 1, num_components: 0}
          # b: carry Z (cost 5) holds 2 full items and costs more than the core, so it's a cap,
          # but carry U (cost 5) holds only 1, so it isn't; no tank
          - {match_id: PBE1_1, puuid: b, character_id: Y, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: b, character_id: Y, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: b, character_id: Z, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: b, character_id: Z, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: b, character_id: U, tier: 1, unit_instance_index: 1, num_components: 0}
          # c: eliminated in stage 3
          - {match_id: PBE1_1, puuid: c, character_id: W, tier: 2, unit_instance_index: 1, num_components: 0}
          # d: only loose components
          - {match_id: PBE1_1, puuid: d, character_id: W, tier: 1, unit_instance_index: 1, num_components: 1}
          # e: a cost the seed doesn't map
          - {match_id: PBE1_1, puuid: e, character_id: V, tier: 1, unit_instance_index: 1, num_components: 0}
          # f: a 1-cost and a 2-cost carry are both core (under cap_min_cost); a 5-cost tank is never a cap
          - {match_id: PBE1_1, puuid: f, character_id: R, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: f, character_id: R, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: f, character_id: R, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: f, character_id: Q, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: f, character_id: Q, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: f, character_id: K, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: f, character_id: K, tier: 2, unit_instance_index: 1, num_components: 0}
          # g: 2-cost P holds the most items, but 1-cost O is also 3 stars with 2 items, so it's a 1-cost reroll
          - {match_id: PBE1_1, puuid: g, character_id: P, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: g, character_id: P, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: g, character_id: P, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: g, character_id: O, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: g, character_id: O, tier: 3, unit_instance_index: 1, num_components: 0}
          # h: O is 3 stars but holds 1 item, so P's cost stands
          - {match_id: PBE1_1, puuid: h, character_id: P, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: h, character_id: P, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: h, character_id: O, tier: 3, unit_instance_index: 1, num_components: 0}
          # i: O holds 2 items but is 2 stars, so P's cost stands
          - {match_id: PBE1_1, puuid: i, character_id: P, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: i, character_id: P, tier: 3, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: i, character_id: O, tier: 2, unit_instance_index: 1, num_components: 0}
          - {match_id: PBE1_1, puuid: i, character_id: O, tier: 2, unit_instance_index: 1, num_components: 0}
      - input: ref('seed_annotated_units')
        rows:
          - {match_id: PBE1_1, puuid: a, character_id: X, tier: 3, unit_instance_index: 1, rarity: 3, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: a, character_id: Y, tier: 2, unit_instance_index: 1, rarity: 4, role: DA_Role_AttackFighter, shop_unit: true}
          - {match_id: PBE1_1, puuid: a, character_id: W, tier: 2, unit_instance_index: 1, rarity: 2, role: DA_Role_AttackMarksman, shop_unit: true}
          - {match_id: PBE1_1, puuid: a, character_id: T, tier: 2, unit_instance_index: 1, rarity: 4, role: DA_Role_MagicTank, shop_unit: true}
          - {match_id: PBE1_1, puuid: a, character_id: S, tier: 1, unit_instance_index: 1, rarity: 5, role: DA_Role_MagicCaster, shop_unit: false}
          - {match_id: PBE1_1, puuid: b, character_id: Y, tier: 2, unit_instance_index: 1, rarity: 4, role: DA_Role_AttackFighter, shop_unit: true}
          - {match_id: PBE1_1, puuid: b, character_id: Z, tier: 2, unit_instance_index: 1, rarity: 5, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: b, character_id: U, tier: 1, unit_instance_index: 1, rarity: 5, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: c, character_id: W, tier: 2, unit_instance_index: 1, rarity: 2, role: DA_Role_AttackMarksman, shop_unit: true}
          - {match_id: PBE1_1, puuid: d, character_id: W, tier: 1, unit_instance_index: 1, rarity: 2, role: DA_Role_AttackMarksman, shop_unit: true}
          - {match_id: PBE1_1, puuid: e, character_id: V, tier: 1, unit_instance_index: 1, rarity: 6, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: f, character_id: R, tier: 3, unit_instance_index: 1, rarity: 1, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: f, character_id: Q, tier: 2, unit_instance_index: 1, rarity: 2, role: DA_Role_AttackMarksman, shop_unit: true}
          - {match_id: PBE1_1, puuid: f, character_id: K, tier: 2, unit_instance_index: 1, rarity: 5, role: DA_Role_MagicTank, shop_unit: true}
          - {match_id: PBE1_1, puuid: g, character_id: P, tier: 3, unit_instance_index: 1, rarity: 2, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: g, character_id: O, tier: 3, unit_instance_index: 1, rarity: 1, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: h, character_id: P, tier: 3, unit_instance_index: 1, rarity: 2, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: h, character_id: O, tier: 3, unit_instance_index: 1, rarity: 1, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: i, character_id: P, tier: 3, unit_instance_index: 1, rarity: 2, role: DA_Role_MagicCaster, shop_unit: true}
          - {match_id: PBE1_1, puuid: i, character_id: O, tier: 2, unit_instance_index: 1, rarity: 1, role: DA_Role_MagicCaster, shop_unit: true}
