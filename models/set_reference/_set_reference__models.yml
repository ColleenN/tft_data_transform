version: 2

unit_tests:
  - name: set_unit_traits_count_trait_units
    model: set_unit_traits
    given:
      - input: source('tft_reference', 'unit_innate_traits')
        rows:
          - {source_object: a.gz, set_number: 19, api_name: DA_ZIGGS19, trait_api_name: DA_YORDLE19, trait_name: Yordle}
          - {source_object: a.gz, set_number: 19, api_name: DA_TEEMO19, trait_api_name: DA_YORDLE19, trait_name: Yordle}
          - {source_object: a.gz, set_number: 19, api_name: DA_TEEMO19, trait_api_name: DA_TEEMO19_UNIQUETRAIT, trait_name: Unique}
          - {source_object: b.gz, set_number: 19, api_name: DA_ZIGGS19, trait_api_name: DA_YORDLE19, trait_name: Yordle}
    expect:
      rows:
        - {source_object: a.gz, api_name: DA_ZIGGS19, trait_api_name: DA_YORDLE19, num_trait_units: 2}
        - {source_object: a.gz, api_name: DA_TEEMO19, trait_api_name: DA_YORDLE19, num_trait_units: 2}
        - {source_object: a.gz, api_name: DA_TEEMO19, trait_api_name: DA_TEEMO19_UNIQUETRAIT, num_trait_units: 1}
        - {source_object: b.gz, api_name: DA_ZIGGS19, trait_api_name: DA_YORDLE19, num_trait_units: 1}

  - name: set_units_overrides_per_capture
    model: set_units
    given:
      - input: source('tft_reference', 'units')
        rows:
          - {source_object: a.gz, set_number: 16, api_name: TFT16_GALIO, cost: 5, shop_unit: false}
          - {source_object: a.gz, set_number: 16, api_name: TFT16_JINX, cost: 3, shop_unit: true}
          - {source_object: b.gz, set_number: 16, api_name: TFT16_GALIO, cost: 5, shop_unit: false}
          - {source_object: c.gz, set_number: 19, api_name: DA_JINX19, cost: 2, shop_unit: true, unlockable: true, unlock_condition: 3 items on an Ionic Spark or Hitmaker champion}
      - input: ref('seed_unit_overrides')
        rows:
          - {set_num: 16, api_name: TFT16_GALIO, shop_gold_cost: null, num_board_slots: 0}
          - {set_num: 16, api_name: TFT16_BROCK, shop_gold_cost: 7, num_board_slots: null}
    expect:
      rows:
        - {source_object: a.gz, set_num: 16, api_name: TFT16_GALIO, shop_gold_cost: 5, one_star_gold_value: 0, num_board_slots: 0}
        - {source_object: a.gz, set_num: 16, api_name: TFT16_JINX, shop_gold_cost: 3, one_star_gold_value: 3, num_board_slots: 1}
        - {source_object: a.gz, set_num: 16, api_name: TFT16_BROCK, shop_gold_cost: 7, one_star_gold_value: 7, num_board_slots: 1}
        - {source_object: b.gz, set_num: 16, api_name: TFT16_GALIO, shop_gold_cost: 5, one_star_gold_value: 0, num_board_slots: 0}
        - {source_object: b.gz, set_num: 16, api_name: TFT16_BROCK, shop_gold_cost: 7, one_star_gold_value: 7, num_board_slots: 1}
        - {source_object: c.gz, set_num: 19, api_name: DA_JINX19, shop_gold_cost: 2, one_star_gold_value: 2, num_board_slots: 1, unlockable: true, unlock_condition: 3 items on an Ionic Spark or Hitmaker champion}
