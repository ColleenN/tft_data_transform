version: 2

unit_tests:
  - name: set_units_overrides_per_capture
    model: set_units
    given:
      - input: source('tft_reference', 'units')
        rows:
          - {source_object: a.gz, set_number: 16, api_name: TFT16_GALIO, cost: 5, shop_unit: false}
          - {source_object: a.gz, set_number: 16, api_name: TFT16_JINX, cost: 3, shop_unit: true}
          - {source_object: b.gz, set_number: 16, api_name: TFT16_GALIO, cost: 5, shop_unit: false}
          - {source_object: c.gz, set_number: 19, api_name: DA_JINX19, cost: 2, shop_unit: true}
      - input: ref('seed_unit_overrides')
        rows:
          - {set_num: 16, api_name: TFT16_GALIO, shop_gold_cost: null, num_board_slots: 0}
          - {set_num: 16, api_name: TFT16_BROCK, shop_gold_cost: 7, num_board_slots: null}
    expect:
      rows:
        - {source_object: a.gz, set_num: 16, api_name: TFT16_GALIO, shop_gold_cost: 5, one_star_gold_value: 0, num_board_slots: 0}
        - {source_object: a.gz, set_num: 16, api_name: TFT16_JINX, shop_gold_cost: 3, one_star_gold_value: 3, num_board_slots: 1}
        - {source_object: a.gz, set_num: 16, api_name: TFT16_BROCK, shop_gold_cost: 7, one_star_gold_value: 7, num_board_slots: 1}
        - {source_object: b.gz, set_num: 16, api_name: TFT16_GALIO, shop_gold_cost: 5, one_star_gold_value: 0, num_board_slots: 0}
        - {source_object: b.gz, set_num: 16, api_name: TFT16_BROCK, shop_gold_cost: 7, one_star_gold_value: 7, num_board_slots: 1}
        - {source_object: c.gz, set_num: 19, api_name: DA_JINX19, shop_gold_cost: 2, one_star_gold_value: 2, num_board_slots: 1}
