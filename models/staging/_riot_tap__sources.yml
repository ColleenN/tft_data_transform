version: 2

sources:
  - name: riot_tap
    description: >
      Raw TFT match detail loaded by riot_tap (tap-riotapi) through Meltano's
      target-bigquery loader (z3z1ma variant). Each row holds the full match
      payload in the JSON `data` column plus Singer metadata columns.
    schema: match_data_landing_zone
    config:
      loaded_at_field: _sdc_batched_at
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 48, period: hour}

    tables:
      - name: tft_player_match_detail
        description: Match detail for individually followed players (including the PBE player list).
      - name: apex_ranked_ladder_match_detail
        description: Match detail pulled from apex league ladders (master, grandmaster, challenger).
      - name: normal_ranked_ladder_match_detail
        description: Match detail pulled from non-apex ranked ladders.
