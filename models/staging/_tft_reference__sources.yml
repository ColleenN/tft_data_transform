version: 2

sources:
  - name: tft_reference
    description: >
      Set reference data that tft_set_info_tools' loader appends from mirrored
      Community Dragon snapshots. Every row carries the capture it came from
      (channel, build, captured_at, source_object) and its set_number.
    schema: "{{ var('reference_dataset', 'tft_reference') }}"
    tables:
      - name: units
        description: Units per set, one copy per loaded capture.
      - name: items
        description: Equippable items per set, one copy per loaded capture.
      - name: item_types
        description: One row per item and type (artifact, radiant, emblem and so on).
      - name: unit_innate_traits
        description: One row per unit and trait it has on its own, without emblems.
      - name: trait_tiers
        description: One row per trait and tier.
      - name: item_components
        description: One row per item and component, with how many of that component it takes.
      - name: loaded_captures
        description: One row per capture the loader has loaded or skipped.
      - name: client_deploys
        description: >
          Client builds published to each version set (live-<region> or
          pbe-global), from mirrored Patchsieve captures. captured_at is when
          the capture first saw the build, so it trails the real deploy by up
          to one polling interval.
